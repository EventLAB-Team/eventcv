[package]
name = "eventcv-core"
version = "0.0.1"
edition = "2021"

[dependencies]
ndarray = "0.17"
npyz = { version = "0.9", features = ["derive", "npz"] }
rayon = "1.10"
rosbag = "0.6.3"
# Optional: `.h5`/`.hdf5` reading. Builds libhdf5 from source (needs cmake) and
# bundles the LZF filter used by event datasets. Enable with `--features hdf5`.
hdf5 = { package = "hdf5-metno", version = "0.12", optional = true, default-features = false, features = ["static", "lzf", "zlib"] }
