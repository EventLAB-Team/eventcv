[package]
name = "eventcv-core"
version = "0.0.1"
edition = "2021"
description = "Rust core of EventCV — OpenCV for event-based vision."
license = "Apache-2.0"
repository = "https://github.com/EventLAB-Team/eventcv"
keywords = ["event-camera", "computer-vision", "dvs", "neuromorphic"]
categories = ["computer-vision"]

[dependencies]
ndarray = "0.17"
npyz = { version = "0.9", features = ["derive", "npz"] }
rayon = "1.10"
rosbag = "0.6.3"
# Bundle per-column `.npy` arrays into an `.npz` (STORED) when saving streams/frames.
# Same major version npyz already pulls transitively; only `FileOptions` is named here.
zip = { version = "0.6", default-features = false }
# Pure-Rust PNG encoder for colormapped frame export (`.png`) — no system deps, keeps wheels easy.
png = "0.17"
# Optional: `.h5`/`.hdf5` reading. Builds libhdf5 from source (needs cmake) and
# bundles the LZF filter used by event datasets. Enable with `--features hdf5`.
hdf5 = { package = "hdf5-metno", version = "0.12", optional = true, default-features = false, features = ["static", "lzf", "zlib"] }

# docs.rs builds with default features (hdf5 off), so it never has to compile libhdf5
# from source — the API surface is identical, and the build stays fast and network-free.
[package.metadata.docs.rs]
features = []
rustdoc-args = ["--cfg", "docsrs"]
