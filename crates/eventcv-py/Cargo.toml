[package]
name = "eventcv-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
eventcv-core = { path = "../eventcv-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"

[features]
# Build `.h5`/`.hdf5` support into the extension (forwards to eventcv-core, which
# builds libhdf5 from source — needs cmake). Enable with `maturin develop --features hdf5`.
hdf5 = ["eventcv-core/hdf5"]

[target.'cfg(target_os = "linux")'.dependencies]
minifb = { version = "0.28", default-features = false, features = ["x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
minifb = { version = "0.28", default-features = false }
