[package]
name = "eventcv-py"
version = "1.0.5"
edition = "2021"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
eventcv-core = { path = "../eventcv-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"
# GPU-accelerated viewer (Metal on macOS, Vulkan on Linux, DX12 on Windows) — all pure-Rust,
# so wheels still build without system graphics SDKs. Replaces the old minifb CPU rasteriser.
wgpu = "22"
winit = "0.30"
pollster = "0.3"   # block on wgpu's async device/adapter requests
bytemuck = { version = "1", features = ["derive"] }
# Immediate-mode controls drawn into the viewer's existing winit/wgpu event loop. 0.29.1 is the
# release that uses the same winit 0.30 / wgpu 22 pair as the renderer above, so Cargo links one
# graphics stack rather than two.
egui = "=0.29.1"
egui-winit = { version = "=0.29.1", features = ["accesskit"] }
egui-wgpu = "=0.29.1"
# Native file chooser (XDG portal on Linux, platform dialogs on macOS/Windows). Drag-and-drop and
# the CLI path remain available when a desktop portal is absent.
rfd = "=0.17.2"

[features]
# Build `.h5`/`.hdf5` support into the extension (forwards to eventcv-core, which
# builds libhdf5 from source — needs cmake). Enable with `maturin develop --features hdf5`.
hdf5 = ["eventcv-core/hdf5"]
# Build USB event-camera streaming into the extension (forwards to eventcv-core, which pulls in
# the neuromorphic-drivers crate + a vendored libusb). Enable with `maturin develop --features camera`.
camera = ["eventcv-core/camera"]
# Build ONNX inference (`Model`) into the extension (forwards to eventcv-core, which downloads a
# prebuilt ONNX Runtime at build time). Enable with `maturin develop --features onnx`.
onnx = ["eventcv-core/onnx"]
# Build the GPU compute kernels into the extension (forwards to eventcv-core). The viewer's wgpu is
# the same dependency, so this adds shaders rather than a second graphics stack.
gpu = ["eventcv-core/gpu"]
