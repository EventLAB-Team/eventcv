name: Publish Python Package

on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Wheels bundle libhdf5 (built from source via cmake) + the LZF filter and Microsoft's own
# libonnxruntime, so installed packages get `.h5`/`.hdf5` reading and ONNX inference with no
# extra user installs. abi3 means one wheel per platform covers every CPython >= 3.8.
jobs:
  linux:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # On the runner rather than inside the manylinux container: the workspace is mounted into
      # it, and the library is architecture-specific but not glibc-specific (Microsoft builds it
      # for glibc 2.27), so the host's own wheel is the right one for the target.
      - name: Fetch the ONNX Runtime to bundle
        run: python scripts/fetch_onnxruntime.py
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2_28"
          before-script-linux: |
            set -e

            if command -v cmake >/dev/null &&
               command -v make >/dev/null &&
               command -v gcc >/dev/null &&
               command -v g++ >/dev/null; then
              echo "Build dependencies already installed."
            else
              echo "Installing missing build dependencies..."

              if command -v dnf >/dev/null; then
                dnf install -y cmake make gcc gcc-c++
              elif command -v yum >/dev/null; then
                yum install -y cmake make gcc gcc-c++
              elif command -v apk >/dev/null; then
                apk add --no-cache cmake make g++
              else
                echo "Unsupported package manager"
                exit 1
              fi
            fi
      - name: Check the wheel really is manylinux_2_28
        # maturin's compatibility check reads versioned symbol requirements only, so an
        # *unversioned* reference to a newer glibc — what a prebuilt C dependency built on a
        # newer distro leaves behind — passes it and then fails at `import` on the user's
        # machine. `__isoc23_*` (glibc 2.38) is how that showed up when ONNX Runtime was
        # statically linked; it is cheap to make sure it never comes back. Both binaries in the
        # wheel are checked: the extension, and the runtime bundled beside it.
        run: |
          python -m zipfile -e dist/*.whl unpacked/
          test -n "$(ls unpacked/eventcv/_libs/libonnxruntime.so.* 2>/dev/null)" \
            || { echo "::error::the wheel carries no ONNX Runtime"; exit 1; }
          for binary in unpacked/eventcv/_rust.abi3.so unpacked/eventcv/_libs/libonnxruntime.so.*; do
            if nm -D --undefined-only "$binary" | grep '__isoc23_'; then
              echo "::error::$binary needs glibc 2.38+ symbols and will not import on older systems"
              exit 1
            fi
          done
        shell: bash
      - name: Test installed ARM64 wheel
        if: matrix.target == 'aarch64'
        shell: bash
        run: bash scripts/test_wheel.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # The check that actually settles portability. A platform tag is a claim, and the symbol grep
  # above only catches what we already know to look for; installing the wheel on the oldest glibc
  # it claims to support and running a model is what would have caught the statically linked ONNX
  # Runtime that started all this — it imported fine on the CI runner and nowhere older.
  smoke:
    name: import + inference (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35 — the LTS this broke on.
          - name: ubuntu 22.04
            image: "ubuntu:22.04"
            setup: apt-get update && apt-get install -y --no-install-recommends python3-pip
            python: python3
          # glibc 2.28 — the floor the wheel's own tag promises.
          - name: manylinux_2_28
            image: "quay.io/pypa/manylinux_2_28_x86_64"
            setup: "true"
            python: /opt/python/cp311-cp311/bin/python
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install the wheel and run a model on it
        # `onnx` writes the two-node fixture the tests build; the runtime under test is the one
        # inside the wheel, and `--version` prints which library it picked and from where.
        run: |
          ${{ matrix.setup }}
          ${{ matrix.python }} -m pip install --upgrade pip
          ${{ matrix.python }} -m pip install dist/*.whl pytest onnx numpy
          ${{ matrix.python }} -m eventcv --version
          ${{ matrix.python }} -m pytest tests/test_model.py -v
        shell: bash

  macos:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install cmake
      - name: Fetch the ONNX Runtime to bundle
        run: python scripts/fetch_onnxruntime.py
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Test installed macOS wheel
        shell: bash
        run: bash scripts/test_wheel.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install cmake
      - name: Fetch the ONNX Runtime to bundle
        run: python scripts/fetch_onnxruntime.py
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - name: Test installed Windows wheel
        shell: bash
        run: bash scripts/test_wheel.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Validate source distribution
        run: |
          python -m pip install twine
          python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # The standalone `eventcv` binary that `scripts/install.sh` / `install.ps1` download: the wheel's
  # HDF5 reading and camera streaming without Python (no ONNX Runtime or GPU viewer, which stay in
  # the wheel). Each archive is installed through its own installer before anything is uploaded.
  cli:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/v')
    name: cli (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: aarch64 }
          - { runner: macos-15, target: aarch64-apple-darwin }
          # Native rather than cross-compiled: libhdf5's cmake configure runs test programs.
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - name: Build in manylinux_2_28
        if: runner.os == 'Linux'
        # In the oldest glibc the binary promises, as the wheels are: built on the runner's own
        # distro it would need that distro's glibc on every machine it is installed on.
        run: |
          docker run --rm -v "$PWD":/io -w /io \
            quay.io/pypa/manylinux_2_28_${{ matrix.manylinux }} bash -euc '
              command -v cmake >/dev/null || dnf install -y cmake
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
              cargo build --locked -p eventcv-cli --profile dist --features hdf5,camera
              target/dist/eventcv --version
              target/dist/eventcv info data/test/example.npz
            '
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Check the binary really is glibc 2.28
        if: runner.os == 'Linux'
        # The same guard as the wheels: an unversioned glibc 2.38 symbol passes the link and then
        # fails on the user's machine.
        run: |
          if nm -D --undefined-only target/dist/eventcv | grep '__isoc23_'; then
            echo "::error::the binary needs glibc 2.38+ symbols and will not run on older systems"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - run: python -m pip install cmake
        if: runner.os != 'Linux'
      - name: Build
        if: runner.os != 'Linux'
        shell: bash
        env:
          # A self-contained .exe, needing no Visual C++ runtime on the machine it lands on.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --locked -p eventcv-cli --profile dist --features hdf5,camera
          target/dist/eventcv --version
          target/dist/eventcv info data/test/example.npz
      - name: Package
        shell: bash
        # Unversioned names, so `releases/latest/download/<name>` always resolves.
        run: |
          mkdir -p stage dist
          archive="eventcv-${{ matrix.target }}"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/dist/eventcv.exe LICENSE stage/
            (cd stage && 7z a -tzip "../dist/$archive.zip" eventcv.exe LICENSE >/dev/null)
            archive="$archive.zip"
          else
            cp target/dist/eventcv LICENSE stage/
            tar -czf "dist/$archive.tar.gz" -C stage eventcv LICENSE
            archive="$archive.tar.gz"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - name: Install through install.sh
        if: runner.os != 'Windows'
        run: |
          EVENTCV_DOWNLOAD_URL="file://$PWD/dist" EVENTCV_INSTALL_DIR="$RUNNER_TEMP/bin" \
            sh scripts/install.sh
          "$RUNNER_TEMP/bin/eventcv" --version
      - name: Install through install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EVENTCV_DOWNLOAD_URL = "$PWD\dist"
          $env:EVENTCV_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./scripts/install.ps1
          & "$env:RUNNER_TEMP\bin\eventcv.exe" --version
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist

  # The installers go up beside the archives, so the one-line install always fetches the
  # installer of the release it then downloads from.
  cli-upload:
    name: Attach binaries to the release
    runs-on: ubuntu-latest
    needs: [cli]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* scripts/install.sh scripts/install.ps1 --clobber

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # `smoke` is in here deliberately: a wheel that fails to import on an old distro must not
    # reach PyPI, and that is not visible from the build job alone.
    needs: [linux, smoke, macos, windows, sdist]
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/eventcv
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1


  release-checks:
    name: Release package checks
    runs-on: ubuntu-latest
    if: always()
    needs: [linux, macos, windows, sdist, smoke, cli]

    steps:
      - name: Verify release builds
        shell: bash
        env:
          RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v') }}
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          SDIST: ${{ needs.sdist.result }}
          SMOKE: ${{ needs.smoke.result }}
          CLI: ${{ needs.cli.result }}
        run: |
          if [[ "$RELEASE_PR" != "true" ]]; then
            echo "Not a release PR. Validation not required."
            exit 0
          fi

          for job in LINUX MACOS WINDOWS SDIST SMOKE CLI; do
            if [[ "${!job}" != "success" ]]; then
              echo "::error::$job did not pass: ${!job}"
              exit 1
            fi
          done

          echo "All release package checks passed."

