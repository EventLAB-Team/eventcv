version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

updates:
  # Rust workspace and member crates
  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"

  # Python package and documentation dependencies
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/docs"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    versioning-strategy: "auto"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
