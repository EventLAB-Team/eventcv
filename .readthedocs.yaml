# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# autodoc imports the compiled `eventcv` extension. Compiling it here (Rust + a bundled libhdf5
# over ~580 crates) no longer fits RTD's 15-minute build limit, so install the published wheel
# for this commit's version instead — the release workflow already builds and tests it.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - python -m pip install --upgrade pip
      # A release reaches RTD (merge to main, then the tag) before its wheels reach PyPI, so fall
      # back to the newest published wheel rather than fail. `--only-binary` keeps pip from ever
      # picking the sdist and compiling. The page title shows the version actually documented.
      - >-
        V=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])');
        python -m pip install --only-binary=eventcv "eventcv==$V"
        || { echo "WARNING: eventcv $V is not on PyPI yet; documenting the newest published wheel"; python -m pip install --only-binary=eventcv eventcv; }
      - python -m pip install -r docs/requirements.txt

sphinx:
  configuration: docs/conf.py
