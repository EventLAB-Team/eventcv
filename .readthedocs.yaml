# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# autodoc imports the compiled `eventcv` extension, so RTD must build it: that needs a
# Rust toolchain (for the PyO3 crate) and cmake (to compile the bundled libhdf5). Both
# are provided below, then the package is pip-installed via its maturin backend.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    rust: latest
  apt_packages:
    - cmake
  jobs:
    # The shipping release profile (fat LTO, 1 codegen unit) over hdf5+camera+onnx+gpu+nn blows
    # RTD's build time limit. autodoc only imports the module, so build it unoptimised; a
    # `.cargo/config.toml` profile overrides Cargo.toml's and is picked up by pip's in-tree build.
    pre_install:
      - mkdir -p .cargo && printf '[profile.release]\nlto = false\ncodegen-units = 256\nopt-level = 0\n' > .cargo/config.toml

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
