# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# autodoc imports the compiled `eventcv` extension, so RTD must build it: that needs a
# Rust toolchain (for the PyO3 crate) and cmake (to compile the bundled libhdf5). Both
# are provided below, then the package is pip-installed via its maturin backend.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
    rust: latest
  apt_packages:
    - cmake

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
